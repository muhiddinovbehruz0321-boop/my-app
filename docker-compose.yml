services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: breachline
      POSTGRES_PASSWORD: breachline_dev
      POSTGRES_DB: breachline
    ports:
      - "5432:5432"
    volumes:
      - breachline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breachline -d breachline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  breachline-postgres:
